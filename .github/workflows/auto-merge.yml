name: Auto-Merge on CI Pass

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  policy-gate:
    name: Policy-gated auto-merge
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      merged: ${{ steps.gate.outputs.merged }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Check gates, enable auto-merge, and close the linked issue
        id: gate
        run: |
          echo "merged=false" >> "$GITHUB_OUTPUT"

          # Get PR number from the workflow run
          PR=$(gh api "repos/$REPO/actions/runs/$RUN_ID" \
            --jq '.pull_requests[0].number // empty' 2>/dev/null)

          if [ -z "$PR" ]; then
            echo "No PR associated with this run — skipping"
            exit 0
          fi

          echo "Checking gates for PR #$PR..."

          # Get PR body
          PR_BODY=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body')

          # Gate 1: PR body must contain Closes #N
          if ! echo "$PR_BODY" | grep -qiE "closes?\s+#[0-9]+"; then
            echo "SKIP: PR #$PR has no 'Closes #N' — auto-merge not enabled"
            exit 0
          fi

          # Extract issue number
          ISSUE=$(echo "$PR_BODY" | grep -ioE "closes?\s+#[0-9]+" | grep -oE "[0-9]+" | head -1)
          echo "  Linked issue: #$ISSUE"

          # Get issue body
          ISSUE_BODY=$(gh issue view "$ISSUE" --repo "$REPO" --json body --jq '.body')

          # Gate 2: issue must have Auto-merge allowed: yes
          if ! echo "$ISSUE_BODY" | grep -qiE "\*\*Auto-merge allowed:\*\*\s*yes"; then
            echo "SKIP: Issue #$ISSUE does not have 'Auto-merge allowed: yes'"
            exit 0
          fi

          # Gate 3: issue must NOT have Risk level: HIGH
          if echo "$ISSUE_BODY" | grep -qiE "\*\*Risk level:\*\*\s*HIGH"; then
            echo "SKIP: Issue #$ISSUE has Risk level: HIGH — manual review required"
            exit 0
          fi

          # All gates passed — enable auto-merge
          echo "All gates passed — enabling auto-merge (squash) for PR #$PR"
          gh pr merge "$PR" \
            --repo "$REPO" \
            --auto \
            --squash

          # GitHub's implicit "Closes #N" auto-close-on-merge is unreliable
          # for PRs merged via `gh pr merge --auto` under GITHUB_TOKEN, even
          # with issues: write granted (confirmed empirically: a throwaway
          # PR merged cleanly this way but left its linked issue open, while
          # an identical merge performed directly with a full-scope PAT
          # closed it instantly). A separate job listening for
          # `pull_request: closed` doesn't fix this either — GitHub Actions
          # does not trigger new workflow runs from events caused by the
          # default GITHUB_TOKEN, so that event never arrives. Instead,
          # poll for the merge to land within *this* run (whose own trigger
          # is workflow_run, not GITHUB_TOKEN-caused, so it isn't subject to
          # that suppression) and close the issue explicitly once it does.
          #
          # The same suppression is why this repo also needs an explicit
          # deploy step below: `deploy.yml`'s `push: branches: [master]`
          # trigger never fires for these auto-merges either (confirmed:
          # PR #193, merged this way, produced no new Vercel deployment
          # even though an earlier manually-merged PR into the same branch
          # deployed correctly). `merged` is exposed as a job output so the
          # next step can run the deploy for real.
          echo "Waiting for PR #$PR to merge..."
          PR_STATE="OPEN"
          for i in $(seq 1 24); do
            PR_STATE=$(gh pr view "$PR" --repo "$REPO" --json state --jq '.state')
            if [ "$PR_STATE" = "MERGED" ]; then
              echo "PR #$PR merged."
              break
            fi
            sleep 5
          done

          if [ "$PR_STATE" != "MERGED" ]; then
            echo "PR #$PR has not merged after ~2 minutes of polling (state: $PR_STATE) — leaving issue #$ISSUE open for now (backlog hygiene sweep will catch it if it merges later)"
            exit 0
          fi

          echo "merged=true" >> "$GITHUB_OUTPUT"

          ISSUE_STATE=$(gh issue view "$ISSUE" --repo "$REPO" --json state --jq '.state' 2>/dev/null)
          if [ "$ISSUE_STATE" = "CLOSED" ]; then
            echo "Issue #$ISSUE already closed — nothing to do"
            exit 0
          fi

          echo "Explicitly closing issue #$ISSUE (linked PR #$PR merged)"
          gh issue close "$ISSUE" --repo "$REPO" \
            --comment "Closed automatically: linked PR #$PR merged (https://github.com/$REPO/pull/$PR)."

  deploy:
    name: Deploy to Vercel (auto-merge path)
    needs: policy-gate
    if: needs.policy-gate.outputs.merged == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: jcltSRl27oNddBEszaaDX86J
      VERCEL_PROJECT_ID: prj_7XeYVrgnT7b7nVDjx4FDrbLLsvqx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
